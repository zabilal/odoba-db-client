name: Driver conformance

# REQ-DRV-1 / NFR-Q1: the same battery against every driver, on real servers.
# Not run per-push: these are slow and need containers.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/source/**"
      - "internal/e2e/**"

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ikigai
          POSTGRES_DB: ikigai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ikigai
          MYSQL_DATABASE: ikigai_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s
          --health-timeout 5s --health-retries 10

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ikigai
          MARIADB_DATABASE: ikigai_test
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect" --health-interval 5s
          --health-timeout 5s --health-retries 10

      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

      # The JSON module is not something a plain server can be asked for, so
      # the keys that need it are read against a server that has it.
      redis-json:
        image: redis/redis-stack-server:latest
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

      cassandra:
        image: cassandra:5
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'" --health-interval 15s
          --health-timeout 10s --health-retries 20

      # Kafka in KRaft mode — no ZooKeeper.
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]

      # libSQL is SQLite over a wire (T4.3): one container, told that it is
      # the primary, and no fixture beyond what the suite writes itself.
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports: ["8080:8080"]
        env:
          SQLD_NODE: primary

      firebird:
        image: firebirdsql/firebird:5
        ports: ["3050:3050"]
        env:
          FIREBIRD_ROOT_PASSWORD: ikigai
          FIREBIRD_DATABASE: ikigai.fdb
          FIREBIRD_USER: ikigai
          FIREBIRD_PASSWORD: ikigai

      # A second Firebird, configured to refuse wire encryption, so that
      # encryption being this driver's default can be proved against a server
      # that will not do it rather than asserted (ADR-0156, NFR-S3).
      firebird-plain:
        image: firebirdsql/firebird:5
        ports: ["3051:3050"]
        env:
          FIREBIRD_ROOT_PASSWORD: ikigai
          FIREBIRD_DATABASE: plain.fdb
          FIREBIRD_USER: ikigai
          FIREBIRD_PASSWORD: ikigai
          FIREBIRD_CONF_WireCrypt: Disabled

      # DynamoDB Local is the service's own implementation of its API and
      # runs offline (T4.6). It takes any credentials at all, so what it can
      # prove is everything but the classification of a refused one.
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]

      # OpenSearch with its security plugin off (T5.15): one node, which is
      # all a search engine needs to answer everything this asks of it. What
      # it cannot prove is a refused password or a certificate, which are held
      # by tests over a server made for the purpose (ADR-0173).
      opensearch:
        image: opensearchproject/opensearch:2
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30

      schema-registry:
        image: confluentinc/cp-schema-registry:7.7.0
        ports: ["8081:8081"]
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # A replica set cannot be a service container: it has to be initiated after
      # it starts, and a service container has nowhere to say that. It is also
      # published on the same port inside and out, because a replica set
      # advertises its members' addresses and a member reachable only through a
      # port map is one the driver abandons after discovery (T5.12).
      - name: Start a MongoDB replica set
        run: |
          docker run -d --name mongo-rs -p 57018:57018 mongo:7 \
            --replSet rs0 --bind_ip_all --port 57018
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --port 57018 --quiet \
                 --eval 'db.runCommand("ping").ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --port 57018 --quiet \
            --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:57018"}]})'
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --port 57018 --quiet \
                 --eval 'rs.status().myState' 2>/dev/null | grep -q '^1$'; then
              echo "the replica set has a primary"
              break
            fi
            sleep 2
          done

      # Started by hand, like the replica set: Trino's test server wants one
      # catalog the image does not bring, and a catalog is a file in a
      # directory, which a service container cannot be given from a checkout
      # that has not happened yet (T5.15). The memory limit is what the JVM
      # sizes itself from.
      - name: Start Trino
        run: |
          docker run -d --name trino -p 8085:8080 --memory 1536m \
            -v "$PWD/internal/source/drivers/trino/testdata/blackhole.properties:/etc/trino/catalog/blackhole.properties:ro" \
            trinodb/trino:483
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:8085/v1/info | grep -q '"starting":false'; then
              echo "trino is up"
              break
            fi
            sleep 3
          done

      # Pulsar standalone: broker, bookie and metadata store in one process,
      # which is a command and so is started by hand (T5.16). It takes most of
      # a minute to answer.
      - name: Start Pulsar
        run: |
          docker run -d --name pulsar -p 6650:6650 -p 8088:8080 --memory 1400m \
            -e PULSAR_MEM="-Xms256m -Xmx512m -XX:MaxDirectMemorySize=384m" \
            -e PULSAR_STANDALONE_USE_ZOOKEEPER=0 \
            apachepulsar/pulsar:4.0.6 bin/pulsar standalone --no-functions-worker --no-stream-storage
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8088/admin/v2/namespaces/public 2>/dev/null | grep -q default; then
              echo "pulsar is up"
              break
            fi
            sleep 2
          done

      # NATS with JetStream on, which is an argument and so is started by hand
      # (T5.16). Kept in memory: the suite makes and removes its own streams.
      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.12 -js -m 8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "nats is up"
              break
            fi
            sleep 1
          done

      # Redpanda, which speaks Kafka's protocol and is asked everything the
      # Kafka driver is asked (T5.16). By hand because it is started with
      # arguments, which a service container cannot be given, and on the port
      # it advertises, because a client that bootstraps is then sent there.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 59192:59192 --memory 1200m \
            redpandadata/redpanda:v26.2.4 redpanda start \
            --mode dev-container --smp 1 --memory 700M --reserve-memory 0M --overprovisioned \
            --kafka-addr PLAINTEXT://0.0.0.0:59192 \
            --advertise-kafka-addr PLAINTEXT://127.0.0.1:59192
          for i in $(seq 1 30); do
            if docker exec redpanda rpk cluster info -X brokers=127.0.0.1:59192 >/dev/null 2>&1; then
              echo "redpanda is up"
              break
            fi
            sleep 2
          done

      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev

      # IKIGAI_REQUIRE_* turn a missing server into a failure. Locally the
      # suites skip when no server is running; in CI a skip would be a silent
      # pass of a suite that never ran.
      - name: Run conformance suite and journeys
        env:
          IKIGAI_REQUIRE_PG: "1"
          IKIGAI_PG_PORT: "5432"
          IKIGAI_REQUIRE_MYSQL: "1"
          IKIGAI_MYSQL_PORT: "3306"
          IKIGAI_MARIADB_PORT: "3307"
          IKIGAI_REQUIRE_MONGO: "1"
          IKIGAI_MONGO_PORT: "27017"
          IKIGAI_REQUIRE_MONGO_RS: "1"
          IKIGAI_MONGO_RS_PORT: "57018"
          IKIGAI_REQUIRE_REDIS: "1"
          IKIGAI_REDIS_PORT: "6379"
          IKIGAI_REQUIRE_REDIS_JSON: "1"
          IKIGAI_REDIS_JSON_PORT: "6380"
          IKIGAI_REQUIRE_LIBSQL: "1"
          IKIGAI_LIBSQL_URL: "http://127.0.0.1:8080"
          IKIGAI_REQUIRE_FIREBIRD: "1"
          IKIGAI_FIREBIRD_PORT: "3050"
          IKIGAI_FIREBIRD_PLAIN_PORT: "3051"
          IKIGAI_REQUIRE_DYNAMODB: "1"
          IKIGAI_DYNAMODB_ENDPOINT: "http://127.0.0.1:8000"
          IKIGAI_REQUIRE_OPENSEARCH: "1"
          IKIGAI_OPENSEARCH_PORT: "9200"
          IKIGAI_REQUIRE_TRINO: "1"
          IKIGAI_TRINO_PORT: "8085"
          IKIGAI_REQUIRE_NATS: "1"
          IKIGAI_NATS_PORT: "4222"
          IKIGAI_REQUIRE_PULSAR: "1"
          IKIGAI_PULSAR_PORT: "6650"
          IKIGAI_PULSAR_ADMIN_PORT: "8088"
        run: go test -tags=conformance -timeout 20m ./internal/source/... ./internal/e2e/

      # The Kafka driver's whole suite again, against Redpanda. The same driver
      # is what is promised of it, and the few places the two differ are the
      # ones the suite asks which it is talking to.
      - name: Run the Kafka suite against Redpanda
        env:
          IKIGAI_REQUIRE_KAFKA: "1"
          IKIGAI_KAFKA_PORT: "59192"
          IKIGAI_KAFKA_IS: redpanda
        run: go test -tags=conformance -timeout 10m ./internal/source/drivers/kafka
