name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  # NFR-D3: Fyne requires CGO, so cross-compiling from one host is not a
  # supported workflow. Every platform builds on its own runner, and it does so
  # from Phase 0 rather than being discovered at release time (RISK-10).
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev

      - name: Build
        run: go build ./...

      # Timing-budget gates (TestGateG0_*) skip themselves under -race: the
      # detector slows execution 5-20x, so a budget measured under it measures
      # the detector, not the code. They run in the performance job below,
      # without -race. Do not add -race there.
      # -timeout because the default is ten minutes per package and the window's
      # own suite takes over eight of them under the detector on this machine —
      # on a hosted runner it went past ten and was killed, which reads as a
      # failure and is a clock.
      - name: Test
        run: go test -race -timeout 30m ./...

  lint:
    name: Lint
    # On each platform, because a linter sees only the files this one builds.
    # The first run of the lint job found three unwrapped errors in the XDG
    # portal's file dialog, which is Linux-only and which no run on a Mac had
    # ever looked at; native_windows.go and native_darwin.go are the same
    # question asked the other way. Cross-linting with GOOS set is not the
    # answer: DuckDB's bindings are cgo and do not type-check cross-compiled,
    # so the whole run comes back as one import failure.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      # golangci-lint is built here rather than downloaded. Its published
      # binaries are built with an older Go than this module targets, and a
      # linter cannot load a configuration for a language version it cannot
      # parse: "the Go language version (go1.24) used to build golangci-lint is
      # lower than the targeted Go version (1.26.6)". Building it with the Go
      # this job already has takes our language version out of somebody else's
      # release schedule.
      #
      # The version is pinned rather than latest, so that a linter release
      # cannot turn this red on a morning nobody changed anything: moving it is
      # a commit, with whatever the new checks find dealt with in that commit.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      # --build-tags overrides the configuration's, dropping duckdb: that driver
      # is behind a tag because it needs a cgo library, and a runner that has not
      # got one would fail the whole job on an import rather than on anything
      # about this code. The configuration keeps it, so a local run and the
      # commit gate lint it where the library is.
      - name: Lint
        run: golangci-lint run --timeout 10m --build-tags=conformance

  coverage:
    name: Core coverage (NFR-Q2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Measure
        run: |
          go test -coverprofile=coverage.out \
            ./internal/source/... ./internal/model/... ./internal/diff/... \
            ./internal/redact/...
          go tool cover -func=coverage.out | tail -1

  # NFR-Q3: budget assertions fail the build on regression. Benchmarks run on
  # a fixed runner class so numbers stay comparable across commits.
  bench:
    name: Performance budgets (NFR-Q3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      # The Phase 0 gates, as budget assertions that fail the build. Without
      # -race on purpose — see internal/testutil/race. -count=1 defeats the
      # test cache, which would otherwise report a stale pass.
      - name: Performance gates
        run: go test -run 'TestGate' -count=1 -v ./...

      # shell: bash turns on pipefail. Without it the pipeline's exit status
      # is tee's, and a failing benchmark would report success.
      - name: Benchmarks
        shell: bash
        run: go test -run '^$' -bench . -benchmem ./... | tee bench.txt

  # NFR-S9: every dependency is scanned on every push, and the build fails on
  # anything reachable from this application's code. An advisory with no fixed
  # version is accepted by name in security/accepted-vulnerabilities.md, with
  # its exposure written down — a scanner nobody can satisfy is a scanner
  # somebody turns off.
  vulnerabilities:
    name: Vulnerabilities (NFR-S9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      - name: Scan
        shell: bash
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > vulns.json
          # A finding with a function in its trace is one this code can reach.
          # Module-level findings are reported too, and are not what fails a
          # build: nothing here calls them.
          jq -r 'select(.finding != null and (.finding.trace[0].function != null)) | .finding.osv' \
            vulns.json | sort -u > reachable.txt
          grep -oE '^GO-[0-9]+-[0-9]+' security/accepted-vulnerabilities.md | sort -u > accepted.txt
          echo "reachable:"; cat reachable.txt
          echo "accepted:";  cat accepted.txt
          # Anything reachable and not accepted fails. An accepted advisory
          # that is no longer reachable is not a failure: it is one to take
          # off the list at the next review.
          if comm -23 reachable.txt accepted.txt | grep .; then
            echo "::error::a reachable vulnerability is not in security/accepted-vulnerabilities.md"
            exit 1
          fi
      - name: Keep the scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck
          path: vulns.json

  # NFR-S9: a bill of materials for every build, so that somebody asking "is
  # that library in there" has an answer that is not a guess. CycloneDX
  # because it is what most scanners read.
  sbom:
    name: SBOM (NFR-S9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      - name: Write the SBOM
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            app -json -licenses -output sbom.cdx.json -main cmd/ikigai .
      - name: Keep the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # NFR-P8: the binary is measured on every platform, on every push.
  #
  # The budget was 60 MB and could only be met by shipping some drivers and not
  # others: a stripped build is 86.6 MB, of which go-ora (Oracle) is 14.8 MB,
  # franz-go (Kafka) 10.4 and aws-sdk-go-v2 (DynamoDB) 5.1, and without those
  # three it is 55.8. That was settled in favour of including every driver, so
  # that installing the application is the whole of installing support for the
  # databases it speaks. The binary therefore *is* the drivers, and a budget
  # forbidding their size would be a budget forbidding the product.
  #
  # So this is a gate again, at a number that catches accidental growth rather
  # than deliberate: a stray dependency, a driver linked twice, an asset
  # embedded by mistake. What keeps it honest is the other half of NFR-P8 —
  # every source added says in TASKS.md what it measured, so the total is an
  # accumulation of named decisions rather than a number nobody can account
  # for. A build that grew without one of those is what this finds.
  #
  # One number for three platforms, because the drivers are the same on all of
  # them and the toolkit links its assets the same way; the print is what says
  # whether that holds.
  binary-size:
    name: Binary size (NFR-P8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      - name: Build and measure
        shell: bash
        run: |
          go build -ldflags="-s -w" -trimpath -o ikigai-release ./cmd/ikigai
          size=$(wc -c < ikigai-release | tr -d " ")
          budget=$((120 * 1024 * 1024))
          # awk rather than bc, which Git bash on the Windows runner has not got:
          # the step ran with -e, so a missing bc failed a job whose measurement
          # was fine — 97,078,272 bytes, well inside the budget.
          mb() { awk -v n="$1" 'BEGIN { printf "%.1f", n / 1048576 }'; }
          printf "binary: %s bytes (%s MB)\n" "$size" "$(mb "$size")"
          printf "budget (NFR-P8): %s bytes\n" "$budget"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::the binary is over its NFR-P8 budget; a source that grew it says what it cost in TASKS.md, and one that did not is the thing to look for"
            exit 1
          fi
          # The command line is the same drivers without the toolkit, so it is
          # measured beside the application rather than on its own: whichever
          # way T4.30 is decided, both move together.
          go build -ldflags="-s -w" -trimpath -o ikigai-cli-release ./cmd/ikigai-cli
          cli=$(wc -c < ikigai-cli-release | tr -d " ")
          printf "command line: %s bytes (%s MB)\n" "$cli" "$(mb "$cli")"
          if [ "$cli" -gt "$size" ]; then
            echo "::error::the command line is larger than the application, which draws: something it must not import has arrived"
            exit 1
          fi
