name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  # NFR-D3: Fyne requires CGO, so cross-compiling from one host is not a
  # supported workflow. Every platform builds on its own runner, and it does so
  # from Phase 0 rather than being discovered at release time (RISK-10).
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Build
        run: go build ./...

      # Timing-budget gates (TestGateG0_*) skip themselves under -race: the
      # detector slows execution 5-20x, so a budget measured under it measures
      # the detector, not the code. They run in the performance job below,
      # without -race. Do not add -race there.
      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  coverage:
    name: Core coverage (NFR-Q2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Measure
        run: |
          go test -coverprofile=coverage.out \
            ./internal/source/... ./internal/model/... ./internal/diff/... \
            ./internal/redact/...
          go tool cover -func=coverage.out | tail -1

  # NFR-Q3: budget assertions fail the build on regression. Benchmarks run on
  # a fixed runner class so numbers stay comparable across commits.
  bench:
    name: Performance budgets (NFR-Q3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      # The Phase 0 gates, as budget assertions that fail the build. Without
      # -race on purpose — see internal/testutil/race. -count=1 defeats the
      # test cache, which would otherwise report a stale pass.
      - name: Performance gates
        run: go test -run 'TestGate' -count=1 -v ./...

      # shell: bash turns on pipefail. Without it the pipeline's exit status
      # is tee's, and a failing benchmark would report success.
      - name: Benchmarks
        shell: bash
        run: go test -run '^$' -bench . -benchmem ./... | tee bench.txt

  # NFR-S9: every dependency is scanned on every push, and the build fails on
  # anything reachable from this application's code. An advisory with no fixed
  # version is accepted by name in security/accepted-vulnerabilities.md, with
  # its exposure written down — a scanner nobody can satisfy is a scanner
  # somebody turns off.
  vulnerabilities:
    name: Vulnerabilities (NFR-S9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Scan
        shell: bash
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > vulns.json
          # A finding with a function in its trace is one this code can reach.
          # Module-level findings are reported too, and are not what fails a
          # build: nothing here calls them.
          jq -r 'select(.finding != null and (.finding.trace[0].function != null)) | .finding.osv' \
            vulns.json | sort -u > reachable.txt
          grep -oE '^GO-[0-9]+-[0-9]+' security/accepted-vulnerabilities.md | sort -u > accepted.txt
          echo "reachable:"; cat reachable.txt
          echo "accepted:";  cat accepted.txt
          # Anything reachable and not accepted fails. An accepted advisory
          # that is no longer reachable is not a failure: it is one to take
          # off the list at the next review.
          if comm -23 reachable.txt accepted.txt | grep .; then
            echo "::error::a reachable vulnerability is not in security/accepted-vulnerabilities.md"
            exit 1
          fi
      - name: Keep the scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck
          path: vulns.json

  # NFR-S9: a bill of materials for every build, so that somebody asking "is
  # that library in there" has an answer that is not a guess. CycloneDX
  # because it is what most scanners read.
  sbom:
    name: SBOM (NFR-S9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Write the SBOM
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            app -json -licenses -output sbom.cdx.json -main cmd/ikigai .
      - name: Keep the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # NFR-P8: the binary is measured on every platform, on every push.
  #
  # It does not meet its budget. A stripped macOS build is 80.2 MB against
  # 60 MB, and two dependencies are most of the gap: go-ora, the Oracle
  # driver, is 14.8 MB of it, and franz-go, the Kafka driver, 10.4 MB — a
  # build without either is 55.8 MB. What to do about that is a product
  # decision, not a build one: put those two behind build tags as DuckDB
  # already is, raise the budget, or ship a core build and a full one.
  # TASKS.md T4.30 records it as the owner's call.
  #
  # Until then this job is a ratchet rather than a gate: it prints the size
  # against the budget and fails only if the binary grows past the ceiling
  # below, so that the gap cannot widen unnoticed while the decision is open.
  # The ceiling moves only when a deliberate, measured addition moves it, and
  # the commit that moves it says what it bought: at 80 MB it was Kafka
  # becoming reachable from the application at all (T4.3), which cost 10.4 MB
  # and had been written and unregistered.
  # The ceiling is one number for three platforms because only macOS has been
  # measured; the print is what tells us the others.
  binary-size:
    name: Binary size (NFR-P8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Build and measure
        shell: bash
        run: |
          go build -ldflags="-s -w" -trimpath -o ikigai-release ./cmd/ikigai
          size=$(wc -c < ikigai-release | tr -d " ")
          budget=$((60 * 1024 * 1024))
          ceiling=$((84 * 1024 * 1024))
          printf "binary: %s bytes (%.1f MB)\n" "$size" "$(echo "$size / 1048576" | bc -l)"
          printf "budget (NFR-P8): %s bytes; ceiling while the decision is open: %s\n" "$budget" "$ceiling"
          if [ "$size" -gt "$ceiling" ]; then
            echo "::error::the binary has grown past the ceiling; see NFR-P8 in TASKS.md T4.30"
            exit 1
          fi
          if [ "$size" -gt "$budget" ]; then
            echo "::warning::the binary is over its NFR-P8 budget by $((size - budget)) bytes"
          fi
